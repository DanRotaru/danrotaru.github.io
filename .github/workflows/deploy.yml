# Builds the static site (`nuxt generate`) and publishes it to GitHub Pages.
# Repo Settings -> Pages -> Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels the in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npx nuxt generate --preset github_pages
        env:
          # Enables the production-only analytics in nuxt.config.ts.
          NODE_ENV: production
          # Optional contact form endpoint, set as a repo variable (Settings -> Variables).
          NUXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
